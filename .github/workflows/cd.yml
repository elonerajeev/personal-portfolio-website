# Continuous Delivery: deploys to production only from main (push or merged PR).
# Reuses the CI workflow, then deploys the verified artifact to Netlify.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One production deploy at a time; never cancel a deploy mid-flight.
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Netlify (production)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.rajeev.pro
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npx --yes netlify-cli@27.11.2 deploy \
            --dir=dist \
            --prod \
            --no-build \
            --message="${COMMIT_SHA::7} via GitHub Actions"

      - name: Smoke test production
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "https://www.rajeev.pro${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ]
          done
          # Fetch first, then search: piping curl into `grep -q` breaks the pipe (curl exit 23) under pipefail.
          html=$(curl -fsS --retry 3 --retry-delay 5 https://www.rajeev.pro/)
          grep -q 'rel="canonical" href="https://www.rajeev.pro/"' <<< "$html"
          echo "canonical tag present"
