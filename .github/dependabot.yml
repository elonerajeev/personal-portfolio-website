version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "@vitejs/*"]
      build-tooling:
        patterns: ["vite", "sass*", "eslint*", "@eslint/*", "globals"]
      ui:
        patterns: ["bootstrap", "react-bootstrap", "swiper", "@fortawesome/*", "chart.js", "react-chartjs-2", "smooth-scrollbar"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
